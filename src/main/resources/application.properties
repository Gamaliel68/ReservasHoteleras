spring.application.name=reservasHotel


spring.security.user.name=user #Usuario en security
spring.security.user.password=prueba12 #Contraseña en security

#Conexion a base de datos.
spring.datasource.url=jdbc:postgresql://localhost:5432/reservas_hoteleras
spring.datasource.username=postgres
spring.datasource.password=Dabson12

#Muestra la consulta de SQL en terminal.
spring.jpa.show-sql=true

#ddl-auto: funciona para saber que se realizara con las entidades,
#ya sea crear la BD, conectarse a una existente, o realizar cambios si hay discrepancias.
#validate: es trabajar sobre una existente, si no coinciden las columnas, no ejecuta.
#update: Si se quiere cambiar la estructura de BD utilizamos update.
spring.jpa.hibernate.ddl-auto=validate
#Como usamos PostgreSQL debemos decirle a spring que tipo de base es para que coincida el mapeo y la BD.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
